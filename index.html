<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- No maximum-scale or user-scalable=no: this is a reading app, and pinch-zoom
     is exactly the thing a reader reaches for. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Annotate prose in place — hold a word to speak a note right there — and branch the conversation out of your notes.">
<meta name="theme-color" content="#E9ECF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12171F" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#127793;</text></svg>">
<title>Meristem — talk in the text</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E9ECF2;
    --card:#FFFFFF;
    --ink:#141B2D;
    --muted:#6A7593;
    --rule:#D9DEE8;
    --mark:#CF2E4B;
    --hi:#FFE066;
    --hi-ink:#141B2D;
    --sheet:#0F1524;
    --on-sheet:#F4F6FB;
    --on-sheet-dim:#9AA6C0;
    --on-sheet-faint:#59637E;
    --on-mark:#FFFFFF;
    --ghost:#9AA3B6;   /* placeholder text */
    --hover:#F1F3F7;   /* menu row hover */
    --pickbg:#FFF6DA;  /* a selected page in the map */
    --wire:#7A879F;
    --r-s:5px;
    --r-m:9px;
    --r-l:11px;
    --pill:7px;
    --lift:0 10px 30px rgba(20,27,45,.10);
    --lift-lg:0 18px 46px rgba(20,27,45,.16);
  }
  /* The palette is the only thing that changes; every rule below reads from it. */
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#12171F;
      --card:#1B222D;
      --ink:#E7ECF4;
      --muted:#93A0B8;
      --rule:#2C3542;
      --mark:#FF6B84;
      --hi:#7A6320;
      --hi-ink:#FFF3C4;
      --sheet:#070A11;
      --on-sheet:#F4F6FB;
      --on-sheet-dim:#93A0B8;
      --on-sheet-faint:#5A6478;
      --on-mark:#1B222D;
      --ghost:#5E6B82;
      --hover:#242C39;
      --pickbg:#3A3116;
      --wire:#5C6980;
      --lift:0 10px 30px rgba(0,0,0,.34);
      --lift-lg:0 18px 46px rgba(0,0,0,.46);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{height:100%;overflow:hidden}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:"Newsreader",Georgia,serif;
    overscroll-behavior:none;
  }
  button{font-family:"Newsreader",Georgia,serif;cursor:pointer;border:0;background:none;color:inherit}
  button:focus-visible{outline:2px solid var(--mark);outline-offset:3px;border-radius:var(--r-s)}
  textarea:focus,textarea:focus-visible{outline:none}
  button{transition:background-color .15s,border-color .15s,color .15s,transform .12s}
  button:active{transform:translateY(1px)}

  /* ---------- shell ---------- */
  .app{max-width:640px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
  .scroller{
    flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-gutter:stable;
    --fade:linear-gradient(to bottom,#000 0,#000 calc(100% - 172px),transparent calc(100% - 122px));
    -webkit-mask-image:var(--fade);mask-image:var(--fade);
  }
  .scroller.scrolled{
    --fade:linear-gradient(to bottom,transparent 0,transparent 22px,#000 70px,#000 calc(100% - 172px),transparent calc(100% - 122px));
  }

  .topbar{
    flex:0 0 auto;z-index:30;
    display:flex;align-items:center;gap:10px;
    height:58px;padding:0 20px;
    background:var(--paper);
  }
  .wordmark{
    font-family:"Newsreader",Georgia,serif;font-weight:700;
    font-size:20px;letter-spacing:.002em;color:var(--ink);
  }
  .acts{margin-left:auto;display:flex;align-items:center;gap:12px;flex:0 0 auto;min-height:39px}
  .tbtn,.btn,.mini,.topbar .reset{
    font-family:"Newsreader",Georgia,serif;font-size:14px;font-weight:700;letter-spacing:.002em;
    line-height:1.2;padding:10px 6px;background:none;border:0;border-radius:var(--pill);
    color:var(--muted);cursor:pointer;
  }
  .tbtn,.mini.solid{color:var(--ink)}
  .tbtn:hover,.btn:hover,.mini:hover,.topbar .reset:hover{color:var(--mark)}
  .tbtn:disabled{opacity:.3;cursor:default}

  /* ---------- paste screen ---------- */
  .paste{padding:24px 20px 40px;display:flex;flex-direction:column;gap:16px}
  .head{flex:0 0 auto;padding:6px 20px 22px;text-align:center;background:var(--paper)}
  .head h1{
    margin:0;font-family:"Newsreader",Georgia,serif;font-weight:700;
    font-size:25px;line-height:1.22;letter-spacing:.002em;color:var(--ink);
  }
  .head p{
    margin:10px auto 0;max-width:44ch;
    font-family:"Newsreader",Georgia,serif;font-size:11px;line-height:1.6;color:var(--muted);
  }
  .hint{font-family:"Newsreader",Georgia,serif;font-size:12px;line-height:1.7;color:var(--muted);margin:0}
  .reader.editing{user-select:text;-webkit-user-select:text;outline:none;min-height:200px}
  .reader.editing p{border-left-color:var(--ink)}
  .reader.editing[data-empty="1"] p:first-child::before{
    content:attr(data-ph);color:var(--ghost);pointer-events:none;
    font:inherit;font-size:inherit;line-height:inherit;letter-spacing:inherit;
  }
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .btn:disabled{opacity:.35;cursor:default}

  /* ---------- reader ---------- */
  .reader{
    font-size:19px;line-height:2.05;letter-spacing:.002em;
    padding:0 0 200px;
    /* Touch needs this off: a long press is the annotate gesture, and without
       it the browser's own selection callout fires instead. A mouse has no such
       conflict, so there the text stays selectable and copyable. */
    user-select:none;-webkit-user-select:none;
  }
  @media (hover:hover) and (pointer:fine){
    .reader{user-select:text;-webkit-user-select:text}
    body.gesturing .reader{user-select:none;-webkit-user-select:none}
  }
  .w:focus-visible{
    outline:2px solid var(--mark);outline-offset:2px;border-radius:var(--r-s);
  }
  .kbhint{
    font-family:"Newsreader",Georgia,serif;font-size:12px;line-height:1.6;
    color:var(--muted);margin:0 0 14px;
  }
  #setup{display:flex;flex-direction:column;gap:16px}
  .reader p{margin:0 0 2.05em;padding-left:16px;border-left:3px solid var(--rule)}
  .w{border-radius:var(--r-s);padding:1px 0}
  .w.live{background:var(--hi);color:var(--hi-ink);box-shadow:0 0 0 3px var(--hi);border-radius:var(--r-s)}
  .w.annot{
    text-decoration:underline;
    text-decoration-color:var(--mark);
    text-underline-offset:5px;
    text-decoration-thickness:2px;
  }
  /* An open note and an answered one are different states, so they get
     different shapes rather than two shades of the same red — a bare numeral
     for a note still waiting, a filled disc once a reply is attached. */
  sup.mk{
    font-family:"Newsreader",Georgia,serif;font-size:10px;font-weight:500;
    color:var(--mark);vertical-align:super;line-height:0;padding-left:2px;
  }
  sup.mk.ans{
    display:inline-block;min-width:12px;height:12px;line-height:12px;
    text-align:center;border-radius:6px;
    background:var(--mark);color:var(--on-mark);
    font-size:8.5px;font-weight:700;padding:0 2px;margin-left:2px;
    /* Sits on the x-height rather than the cap line, so it clears the line above. */
    vertical-align:.32em;
  }
  .w.done{
    text-decoration:underline;
    text-decoration-color:var(--muted);
    text-decoration-style:dotted;
    text-underline-offset:5px;
  }
  .reply{
    margin:.6em 0 1.4em;padding:16px 18px;background:var(--card);
    border-left:3px solid var(--mark);border-radius:var(--r-m);
    box-shadow:var(--lift);
    font-family:"Newsreader",Georgia,serif;font-size:13.5px;line-height:1.65;
  }
  .reply .said{color:var(--mark);font-size:12px;margin-bottom:8px;display:block}
  .reply .said b{font-weight:500}
  .reply .ans{color:var(--ink);white-space:pre-wrap}
  .reply .openrow{display:flex;align-items:baseline;gap:10px;margin-top:11px}
  .reply .open{font-weight:700;color:var(--mark);cursor:pointer}
  .reply .kidcount{color:var(--muted);font-size:12px}
  .mergehead{
    font-family:"Newsreader",Georgia,serif;font-size:13px;color:var(--muted);
    margin:2.6em 0 .3em;padding-top:1.4em;border-top:1px solid var(--rule);
  }
  .rnum{
    display:inline-block;min-width:15px;color:var(--mark);font-weight:700;
  }
  .reply:hover{border-left-color:var(--ink)}

  .pagehead{margin:0 0 1.8em}
  .ctx{
    margin-top:12px;padding-left:16px;border-left:3px solid var(--mark);
  }
  .ctx .cq{
    display:block;font-family:"Newsreader",Georgia,serif;font-size:15px;font-style:italic;
    color:var(--muted);line-height:1.5;margin-bottom:5px;
  }
  .ctx .cn{
    display:block;font-family:"Newsreader",Georgia,serif;font-size:16px;line-height:1.5;color:var(--ink);
  }
  .ctx .cs{display:flex;gap:14px;margin-top:9px}
  .stat{
    background:none;border:0;padding:0;cursor:pointer;
    font-family:"Newsreader",Georgia,serif;font-size:13px;color:var(--muted);
  }
  .stat:hover{color:var(--ink)}
  .stat.on{color:var(--mark);font-weight:700}
  .tnode.done{opacity:.45}
  .tnode .tstat{
    display:inline-block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--mark);margin-top:4px;
  }
  .backlink{
    display:block;margin:0;padding:0;background:none;border:0;cursor:pointer;
    font-family:"Newsreader",Georgia,serif;font-size:14px;font-weight:700;color:var(--muted);
  }
  .backlink:hover{color:var(--mark)}

  .crumb{cursor:pointer;
    font-family:"Newsreader",Georgia,serif;font-size:13px;color:var(--muted);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;
  }

  .treeview{
    position:fixed;inset:0;z-index:45;background:var(--paper);
    display:flex;flex-direction:column;
  }
  .treehead,.treebar{max-width:900px;width:100%;margin:0 auto}
  .treeread{max-width:640px;width:100%;margin:0 auto}
  .treehead{
    display:flex;align-items:center;gap:16px;
    padding:16px 20px;font-family:"Newsreader",Georgia,serif;font-size:14px;color:var(--muted);
  }
  .tsel{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
  .treebar{
    display:flex;align-items:center;gap:16px;padding:0 20px 14px;
    font-family:"Newsreader",Georgia,serif;font-size:14px;color:var(--muted);
  }
  .tcount{flex:1;min-width:0;color:var(--muted)}
  #tselect.armed{color:var(--mark)}
  .tnode.pick{border-left-color:var(--mark);background:var(--pickbg)}
  .tnode .tnum{
    position:absolute;top:-9px;right:-9px;min-width:20px;height:20px;line-height:20px;
    text-align:center;border-radius:50%;background:var(--mark);color:var(--on-mark);
    font-size:11px;font-weight:700;
  }
  #treeopen{color:var(--mark)}
  .treeread{
    flex:1;overflow-y:auto;padding:2px 20px 130px;
    font-family:"Newsreader",Georgia,serif;
  }
  .rnode{
    position:relative;border-left:3px solid var(--rule);
    padding:0 38px 2px 15px;margin:1.5em 0 1.5em;
  }
  .rfold{
    position:absolute;top:-4px;right:0;width:32px;height:32px;
    background:none;border:0;cursor:pointer;color:var(--muted);
    font-size:16px;line-height:32px;text-align:center;
  }
  .rfold:hover{color:var(--mark)}
  .reader .rnode{user-select:none}
  .reader .rtext,.reader .rquote,.reader .rnote{user-select:text}
  .rnode .rnode{margin:1.1em 0 1.1em}
  .rnode.cur{border-left-color:var(--ink)}
  .rnode.resolved{border-left-color:var(--mark)}
  .rnode.dropped{opacity:.5}
  .rhead{
    display:block;width:100%;text-align:left;background:none;border:0;padding:0;cursor:pointer;
    font-family:"Newsreader",Georgia,serif;font-size:15px;font-weight:700;color:var(--mark);
    line-height:1.45;
  }
  .rnode.root .rhead{color:var(--ink)}
  .rhead:hover{text-decoration:underline}
  .rmeta{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:3px}
  .rquote{
    display:block;font-size:13px;font-style:italic;color:var(--muted);
    margin:7px 0 0;line-height:1.5;
  }
  .rtext{
    font-size:15px;line-height:1.62;color:var(--ink);white-space:pre-wrap;margin:9px 0 0;
  }
  .rtext.hid{display:none}
  .rhead:hover .rmeta{color:var(--muted)}
  .rnote{
    display:block;font-size:14px;line-height:1.55;color:var(--ink);
    margin:8px 0 0;padding-left:13px;border-left:2px solid var(--rule);
  }

  .treebody{
    flex:1;overflow:hidden;position:relative;margin-bottom:112px;
    perspective:2600px;perspective-origin:50% 45%;
    touch-action:none;cursor:grab;
    -webkit-mask-image:
      linear-gradient(to right, transparent 0, #000 46px, #000 calc(100% - 46px), transparent 100%),
      linear-gradient(to bottom, transparent 0, #000 38px, #000 calc(100% - 38px), transparent 100%);
    -webkit-mask-composite:source-in;
    mask-image:
      linear-gradient(to right, transparent 0, #000 46px, #000 calc(100% - 46px), transparent 100%),
      linear-gradient(to bottom, transparent 0, #000 38px, #000 calc(100% - 38px), transparent 100%);
    mask-composite:intersect;
  }
  .treebody:active{cursor:grabbing}
  /* SCENE_ORIGIN_X / SCENE_ORIGIN_Y in the script mirror these two values —
     "Fit all" measures from this origin, so change both together. */
  .scene{
    position:absolute;left:50%;top:45%;width:0;height:0;
    transform-style:preserve-3d;
  }
  .scene.anim{transition:transform .38s cubic-bezier(.3,.85,.35,1)}
  .tnode{
    /* origin at 0 0 so the card's own transform carries no rotation residual —
       its centre then lands exactly on the projected point the wires use */
    position:absolute;left:0;top:0;transform-origin:0 0;
    width:186px;margin:0;
    text-align:left;background:var(--card);border:0;cursor:pointer;
    border-left:3px solid var(--rule);border-radius:var(--r-s);
    padding:11px 13px;font-family:"Newsreader",Georgia,serif;
    box-shadow:var(--lift);transform-style:preserve-3d;
  }
  .tnode:hover{border-left-color:var(--ink)}
  .tnode.cur{border-left-color:var(--ink)}
  .tnode.sel{border-left-color:var(--mark);box-shadow:var(--lift-lg);outline:2px solid var(--mark);outline-offset:3px}
  .tnode .tq{display:block;font-size:11px;color:var(--mark);margin-bottom:3px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tnode .tt{display:block;font-size:13px;line-height:1.4;color:var(--ink);
    max-height:3.9em;overflow:hidden}
  .tnode.full{padding:13px 15px}
  .tnode.full .tt{max-height:none;white-space:pre-wrap;font-size:13.5px;line-height:1.6}
  .tnode.full .tq{white-space:normal;overflow:visible;font-size:12px;line-height:1.45;margin-bottom:6px}
  .tnode .tanchor{
    display:block;font-size:11.5px;font-style:italic;color:var(--muted);
    line-height:1.5;margin:0 0 7px;
  }
  .tnode .topen{
    display:block;font-size:11.5px;color:var(--ink);line-height:1.5;
    margin:9px 0 0;padding-left:9px;border-left:2px solid var(--rule);
  }
  #tfull.armed{color:var(--mark)}
  .tnode.cur .tt,.tnode.sel .tt{font-weight:700}
  .tnode .tm{display:block;font-size:11px;color:var(--muted);margin-top:4px}
  .wires{
    position:absolute;inset:0;width:100%;height:100%;
    pointer-events:none;overflow:visible;
  }
  .wires line{stroke:var(--wire);stroke-width:2.2;stroke-linecap:round}
  .wires line.hot{stroke:var(--mark);stroke-width:3.2}

  /* floating live caption */
  .caption{
    position:fixed;z-index:60;left:12px;right:12px;
    max-width:616px;margin:0 auto;
    background:var(--sheet);color:var(--on-sheet);border-radius:var(--r-m);
    padding:14px 16px;font-family:"Newsreader",Georgia,serif;font-size:13px;line-height:1.55;
    display:none;box-shadow:0 16px 44px rgba(15,21,36,.38);
  }
  .caption.on{display:block}
  .caption .rec{display:flex;align-items:center;gap:7px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--on-sheet-dim);margin-bottom:7px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--mark);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.25}}
  .caption .txt{min-height:1.5em;color:var(--on-sheet)}
  .caption .txt:empty::after{content:"listening…";color:var(--on-sheet-faint)}


  /* ---------- bottom sheet ---------- */
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:var(--paper);color:var(--ink);
    max-width:640px;margin:0 auto;
    transform:translateY(calc(100% - 106px));
    transition:transform .28s cubic-bezier(.3,.8,.4,1);
    max-height:78vh;display:flex;flex-direction:column;
  }
  .sheet.open{transform:translateY(0)}
  .sheet.empty{transform:translateY(100%)}
  .grab{
    display:flex;align-items:center;flex-wrap:wrap;gap:9px;padding:14px 18px 16px;
    font-family:"Newsreader",Georgia,serif;font-size:12px;letter-spacing:.01em;flex:0 0 auto;
    cursor:pointer;user-select:none;-webkit-user-select:none;
  }
  .grab .count{color:var(--ink);font-weight:500;flex:0 0 auto;min-width:14px;text-align:center}
  .grab .chev{color:var(--muted);font-size:13px;flex:0 0 auto;padding:0 2px;margin-left:auto}
  .mini{flex:0 0 auto}
  .baracts{flex:1 0 100%;display:flex;gap:8px;flex-wrap:wrap}
  #scopebar.narrow{color:var(--muted)}
  #scopebar{color:var(--ink);font-weight:700}
  .note .onpage{
    display:block;background:none;border:0;padding:0;margin:0 0 3px;cursor:pointer;
    font-family:"Newsreader",Georgia,serif;font-size:11px;letter-spacing:.02em;
    color:var(--mark);text-align:left;
  }
  .note .onpage.here{color:var(--muted);cursor:default}
  .note .onpage:hover{text-decoration:underline}
  .note .onpage.here:hover{text-decoration:none}
  .sheetbody{overflow:auto;padding:0 20px 22px;-webkit-overflow-scrolling:touch}

  .note{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--rule)}
  .note .num{font-family:"Newsreader",Georgia,serif;font-size:11px;font-weight:500;color:var(--mark);padding-top:3px;min-width:18px}
  .note .body{flex:1;min-width:0}
  .note .quote{font-size:14px;color:var(--muted);font-style:italic;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .note .said{
    font-family:"Newsreader",Georgia,serif;font-size:13px;line-height:1.6;color:var(--ink);
    white-space:pre-wrap;word-break:break-word;cursor:text;
    border-left:3px solid transparent;padding-left:11px;
  }
  .note .said:hover{border-left-color:var(--rule)}
  .note .said.editing{border-left-color:var(--ink);outline:none}
  .note .kill{font-size:16px;font-weight:700;color:var(--muted);padding:0 4px;align-self:flex-start}
  .note .kill:hover{color:var(--mark)}


  .modemenu{
    position:fixed;left:12px;right:12px;bottom:74px;z-index:70;
    max-width:616px;margin:0 auto;
    background:var(--card);border:1px solid var(--rule);border-radius:var(--r-m);overflow:hidden;
    box-shadow:var(--lift-lg);
  }
  .mitem{display:block;width:100%;text-align:left;padding:15px 17px;font-family:"Newsreader",Georgia,serif;border-bottom:1px solid var(--rule);cursor:pointer;background:var(--card)}
  .mitem:last-child{border-bottom:0}
  .mitem .n{font-size:15px;font-weight:700;letter-spacing:.002em;color:var(--ink);display:block;margin-bottom:2px}
  .mitem .d{font-size:11.5px;line-height:1.5;color:var(--muted);display:block}
  .mitem:hover{background:var(--hover)}
  .mitem.on{background:var(--ink)}
  .mitem.on .n{color:var(--paper)}
  .mitem.on .d{color:var(--muted)}



  .preview{
    display:block;width:100%;min-height:150px;resize:none;
    background:transparent;border:0;padding:16px;
    font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;line-height:1.65;color:var(--ink);
    white-space:pre-wrap;word-break:break-word;user-select:text;-webkit-user-select:text;
  }
  .previewbox{
    display:none;margin-top:12px;overflow:hidden;
    background:var(--card);border:1px solid var(--rule);border-radius:var(--r-m);
    transition:border-color .15s,box-shadow .15s;
  }
  .previewbox.on{display:block}

  .toast{
    position:fixed;left:50%;transform:translateX(-50%);bottom:110px;z-index:80;
    background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:var(--pill);
    box-shadow:var(--lift-lg);
    font-family:"Newsreader",Georgia,serif;font-size:14px;letter-spacing:.002em;
    opacity:0;transition:opacity .2s;pointer-events:none;
  }
  .toast.on{opacity:1}

  .micnote{
    font-family:"Newsreader",Georgia,serif;font-size:11px;line-height:1.6;color:var(--muted);
    border-left:2px solid var(--mark);padding:2px 0 2px 10px;margin:0;
  }

  /* fallback typing card */
  .typein{position:fixed;inset:0;z-index:70;background:rgba(15,21,36,.55);display:none;align-items:flex-end}
  .typein.on{display:flex}
  .typein .card.drop{outline:2px dashed var(--mark);outline-offset:6px}
  .dropping .reader,.dropping .paste{opacity:.55}
  .typein .card{background:var(--card);width:100%;max-width:640px;margin:0 auto;padding:22px 20px 20px;border-radius:var(--r-l) var(--r-l) 0 0;box-shadow:var(--lift-lg)}
  .typein .q{font-size:15px;font-style:italic;color:var(--muted);margin:0 0 10px}
  .typein textarea{width:100%;min-height:88px;border:1px solid var(--rule);transition:border-color .15s,box-shadow .15s;border-radius:var(--r-s);padding:13px;font-family:"Newsreader",Georgia,serif;font-size:14px;line-height:1.5;resize:none;background:var(--paper);color:var(--ink)}

  /* Once a text is open the standing instructions have done their job; the
     screen is better spent on the text. They come back in the editor. */
  body.reading .head{display:none}

  /* A word joined to the next one in the same run carries the space between
     them, so the underline runs unbroken across a phrase instead of breaking
     at every gap. */
  .w.cont{margin-right:-0.26em;padding-right:0.26em}

  /* Below ~430px the five top-bar controls no longer fit, and the last of them
     used to be pushed off-screen with no way to reach it. */
  @media (max-width:430px){
    .topbar{gap:6px;padding:0 12px}
    .acts{gap:7px}
    .tbtn,.btn,.mini,.topbar .reset{font-size:13px;padding:10px 3px}
    body.reading .wordmark{display:none}
    .treehead,.treebar{gap:10px;padding-left:14px;padding-right:14px}
    .treehead{font-size:13px}
  }
  @media (max-width:340px){
    .wordmark{display:none}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <span class="wordmark">Meristem</span>
    <button class="reset" id="up" hidden>&#8592; Back</button>
    <span class="crumb" id="crumb" hidden></span>
    <span class="acts">
      <button class="reset" id="treebtn" hidden>Tree</button>
      <button class="reset" id="exportbtn" hidden>Export</button>
      <button class="reset" id="edit" hidden>Edit text</button>
      <button class="reset" id="reset" hidden>New text</button>
      <button class="tbtn" id="go">Annotate</button>
    </span>
  </header>

  <div class="head">
    <h1>Talk in the text</h1>
    <p>Hold any word to record a note right there, tap it to type one instead, and drag while holding to cover a whole phrase.</p>
  </div>

  <main class="scroller" id="scroller">
  <section class="paste" id="paste">
    <div class="reader" id="reader" data-ph="Paste here…"></div>
    <div id="setup">
      <div class="row">
        <button class="btn ghost" id="sample">Use sample text</button>
        <button class="btn ghost" id="sampletree">Use sample tree</button>
        <button class="btn ghost" id="importbtn">Paste a thread</button>
        <button class="btn ghost" id="miccheck">Check mic</button>
      </div>
      <p class="micnote" id="micnote" hidden></p>
    </div>
  </section>
  </main>
</div>


<div class="caption" id="caption" role="status" aria-live="polite">
  <div class="rec"><span class="dot"></span><span id="reclabel">Recording</span></div>
  <div class="txt" id="captxt"></div>
</div>

<div class="treeview" id="treeview" role="dialog" aria-modal="true" aria-label="Thread map" hidden>
  <div class="treehead">
    <span class="tsel" id="tsel"></span>
    <button class="reset" id="rootbtn">Root</button>
    <button class="reset" id="fitbtn">Fit all</button>
    <button class="reset" id="readbtn">Read all</button>
    <button class="reset" id="treeopen">Open page</button>
    <button class="reset" id="treeclose">Close</button>
  </div>
  <div class="treebar" id="treebar">
    <span class="tcount" id="tcount"></span>
    <button class="reset" id="tselect">Select pages</button>
    <button class="reset" id="tclear" hidden>Clear</button>
  </div>
  <div class="treeread" id="treeread" hidden></div>
  <div class="treebody" id="treebody">
    <svg class="wires" id="wires"></svg>
    <div class="scene" id="scene"></div>
  </div>
</div>

<div class="modemenu" id="modemenu" role="menu" aria-label="Response mode" hidden></div>

<!-- SHEET -->
<div class="sheet empty" id="sheet">
  <div class="grab" id="grab" role="button" tabindex="0">
    <span class="count" id="count">0</span>
    <button class="mini" id="modebtn" aria-haspopup="menu" aria-expanded="false" aria-controls="modemenu">Respond &#9662;</button>
    <span class="chev" id="chev">&#9650;</span>
    <div class="baracts">
      <button class="mini" id="scopebar">All pages</button>
      <button class="mini" id="ctxbar">Context: path</button>
      <button class="mini solid" id="copybar">Copy prompt</button>
      <button class="mini" id="peekbar">Preview</button>
      <button class="mini" id="replybar">Paste reply</button>
    </div>
  </div>
  <div class="sheetbody" id="sheetbody">
    <div id="notelist"></div>
    <div class="previewbox" id="previewbox"><textarea class="preview" id="preview" spellcheck="false"></textarea></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="typein" id="importin" role="dialog" aria-modal="true" aria-labelledby="importq">
  <div class="card">
    <p class="q" id="importq">Drop a thread file here, or paste it below. This replaces whatever is open.</p>
    <textarea id="importtxt" placeholder="Paste the thread data here…"></textarea>
    <div class="row" style="margin-top:10px">
      <button class="btn" id="importsave">Load thread</button>
      <button class="btn ghost" id="importpick">Choose a file</button>
      <button class="btn ghost" id="importcancel">Cancel</button>
    </div>
    <input type="file" id="importfile" accept=".json,application/json,text/plain" hidden>
  </div>
</div>

<div class="typein" id="replyin" role="dialog" aria-modal="true" aria-labelledby="replyq">
  <div class="card">
    <p class="q" id="replyq">Paste the whole reply. Only the notes block gets read.</p>
    <textarea id="replytxt" placeholder="Paste the AI's response here…"></textarea>
    <div class="row" style="margin-top:10px">
      <button class="btn" id="replysave">Attach replies</button>
      <button class="btn ghost" id="replycancel">Cancel</button>
    </div>
  </div>
</div>

<div class="typein" id="typein" role="dialog" aria-modal="true" aria-labelledby="typeq">
  <div class="card">
    <p class="q" id="typeq"></p>
    <textarea id="typetxt" placeholder="Type, or tap the mic key on your keyboard and talk… Enter saves, Shift+Enter for a new line."></textarea>
    <div class="row" style="margin-top:10px">
      <button class="btn" id="typesave">Save note</button>
      <button class="btn ghost" id="typecancel">Discard</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var SAMPLE = "The bottleneck isn't model quality anymore, it's the interface. Teams that shipped in 2023 assumed the hard part was getting a coherent paragraph out of the thing, so they built around a text box and moved on. That assumption expired about eighteen months ago.\n\nWhat replaced it is less obvious. Most of the time a person spends in a chat product goes to reading, not writing, and yet every affordance in the product is built for the writing half. You get a cursor, a send button, and a scrollback you can do nothing with except scroll.\n\nThe fix most teams reach for is longer memory. That's the wrong lever. Memory helps the model know what you said before; it does nothing for the reader who is halfway down a response and already disagreeing with the second paragraph. That reader has to hold four objections in their head until they reach the bottom, and by then two of them are gone.";

  var $ = function(id){ return document.getElementById(id); };
  var pasteEl=$("paste"), readerEl=$("reader"), sheetEl=$("sheet"),
      capEl=$("caption"), capTxt=$("captxt"), recLabel=$("reclabel"),
      countEl=$("count"), chevEl=$("chev"), listEl=$("notelist"),
      prevEl=$("preview"), prevBox=$("previewbox"), toastEl=$("toast"),
      typeEl=$("typein"), typeQ=$("typeq"), typeTxt=$("typetxt"), micNote=$("micnote");

  /* Every page is a node. The root is what you pasted; each answered note
     becomes a child page you can open and keep working inside. */
  var nodes={}, curId=null, seq=0;
  var words=[];      // tokens of the focused page
  var TOK=[];        // alias kept for the annotation code
  var nextId=1;

  function node(){ return nodes[curId]; }

  /* Notes live on their page and are only ever read through here. An earlier
     version cached nodes[curId].notes in a module variable, which let the two
     drift apart: deleting a note replaced the cached array without writing it
     back, and the async speech path appended to whichever page happened to be
     open when the microphone finally closed. Never cache this. */
  function pageNotes(id){
    var n=nodes[id==null?curId:id];
    return n?n.notes:[];
  }

  /* ---------------- the notes basket ----------------
     Notes live on the page whose words they mark, but you build them up while
     reading across several pages, and they have to leave as one prompt. The
     sheet is therefore a view over every open note in the thread, not over the
     page you happen to be standing on. */
  var noteScope="thread";   // "thread" | "page"

  /* Reading order: the original, then each reply depth-first — the order "Read
     all" uses, and the order the notes were made in. A note's number has to
     mean the same thing in the text, in the sheet and in the prompt. */
  function orderedPages(){
    var seen={}, out=[];
    (function walk(id){
      if(!id||seen[id]||!nodes[id]) return;
      seen[id]=true;
      out.push(id);
      nodes[id].kids.forEach(function(k){
        if(nodes[k]&&nodes[k].parents.every(function(p){ return seen[p]; })) walk(k);
      });
    })(rootId());
    Object.keys(nodes).forEach(function(id){ if(!seen[id]){ seen[id]=true; out.push(id); } });
    return out;
  }

  /* Tokens for a page that isn't the one on screen, so its notes can be quoted
     against their own words. Cached per page and thrown away when its text
     changes. */
  var tokCache={};
  function toksFor(id){
    var n=nodes[id];
    if(!n) return [];
    var c=tokCache[id];
    if(c&&c.text===n.text) return c.toks;
    var t=tokensOf(n.text);
    tokCache[id]={text:n.text,toks:t};
    return t;
  }

  /* Every open note in the thread as {pid, note}, numbered by position. */
  function threadEntries(){
    var out=[];
    orderedPages().forEach(function(pid){
      nodes[pid].notes.forEach(function(nt){ out.push({pid:pid,note:nt}); });
    });
    return out;
  }

  function noteEntries(){
    if(inTree()) return treeNotes.map(function(n){ return {pid:null,note:n}; });
    if(noteScope==="page") return pageNotes().map(function(n){ return {pid:curId,note:n}; });
    return threadEntries();
  }

  /* note id -> the number it shows everywhere. Ids are unique across the whole
     thread, so one lookup serves the text, the sheet and the prompt. */
  function noteNumbers(){
    var map={};
    noteEntries().forEach(function(e,i){ map[e.note.id]=i+1; });
    return map;
  }

  function pageLabel(id,n){
    var x=nodes[id];
    if(!x) return "a page";
    return x.parents.length?trim(x.note,40):"the original text";
  }

  function makeNode(text,parentIds,meta){
    var ps=parentIds==null?[]:(Array.isArray(parentIds)?parentIds.slice():[parentIds]);
    var id="n"+(seq++);
    nodes[id]={
      id:id, parents:ps, text:text,
      notes:[], kids:[],
      quote:(meta&&meta.quote)||"", note:(meta&&meta.note)||"",
      s:(meta?meta.s:0), e:(meta?meta.e:0), para:(meta?meta.para:0),
      merge:ps.length>1, status:"open"
    };
    ps.forEach(function(pid){ if(nodes[pid]) nodes[pid].kids.push(id); });
    return id;
  }
  function firstParent(n){ return n&&n.parents.length?n.parents[0]:null; }

  function tokenize(){
    var n=node();
    words=[];
    (n?n.text:"").replace(/\r/g,"").split(/\n\s*\n/).filter(function(t){return t.trim().length;})
      .forEach(function(para,pi){
        para.trim().split(/\s+/).forEach(function(w){ words.push({t:w,p:pi,c:"src"}); });
      });
    TOK=words.slice();
  }

  function depth(id,memo){
    memo=memo||{};
    if(memo[id]!=null) return memo[id];
    var n=nodes[id];
    if(!n||!n.parents.length) return (memo[id]=0);
    var d=0;
    n.parents.forEach(function(p){ d=Math.max(d,depth(p,memo)+1); });
    return (memo[id]=d);
  }

  function focusNode(id){
    curId=id;
    tokenize();
    kbA=kbB=-1;
    readerEl.classList.remove("editing");
    readerEl.removeAttribute("contenteditable");
    document.body.classList.add("reading");
    $("setup").hidden=true;
    $("reset").hidden=false; $("edit").hidden=false; $("go").hidden=true;
    $("exportbtn").hidden=false;
    render(); refresh(); syncNav();
    $("scroller").scrollTop=0;
  }

  function syncNav(){
    var n=node();
    var up=$("up");
    up.hidden=!(n&&n.parents.length);
    $("treebtn").hidden=!(n&&(n.parents.length||n.kids.length));
    var crumb=$("crumb");
    if(n&&n.parents.length){
      crumb.hidden=false;
      crumb.textContent="\u21B3 "+(n.note?trim(n.note,46):"reply");
    } else crumb.hidden=true;
  }

  function trim(t,n){ t=(t||"").replace(/\s+/g," ").trim(); return t.length>n?t.slice(0,n-1)+"\u2026":t; }
  var voiceMode=true;

  /* ---------------- speech ---------------- */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec=null, heard="", pending=null, listening=false;
  var wantVoice=false, committed="", runFinal="", restarts=0;
  var isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent||"");

  /* Mobile engines sometimes re-report a phrase they already finalised, which
     compounds into "the problem the problem the problem". Collapse any run that
     is an immediate repeat of the run before it. */
  function dedupe(t){
    var w=(t||"").split(/\s+/).filter(Boolean), changed=true;
    while(changed){
      changed=false;
      for(var k=Math.min(12,Math.floor(w.length/2)); k>=2; k--){
        var tail=w.slice(-k).join(" ").toLowerCase();
        var prev=w.slice(-2*k,-k).join(" ").toLowerCase();
        if(tail && tail===prev){ w.splice(-k,k); changed=true; break; }
      }
    }
    return w.join(" ");
  }

  if(!SR){
    voiceMode=false;
    micNote.hidden=false;
    micNote.textContent="This browser has no speech recognition, so holding a word opens a typing box instead. The gesture is the same.";
  }

  function say(msg){ micNote.hidden=false; micNote.textContent=msg; }

  function probeMic(){
    say("Checking…");
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      voiceMode=false; say("This browser gives the page no microphone access at all. Holding a word will open a typing box instead.");
      return;
    }
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      stream.getTracks().forEach(function(t){ t.stop(); });
      if(SR){ voiceMode=true; say("Mic works. Hold a word and talk."); }
      else say("Mic works, but this browser has no speech recognition. Chrome or Safari will transcribe; here you'll get a typing box.");
    }).catch(function(err){
      voiceMode=false;
      if(err&&err.name==="NotAllowedError"){
        say("The mic is blocked here. Usually that's the preview frame, not your phone — save this file and open it in a browser tab and it should work. Until then, holding a word opens a typing box, and your keyboard's mic key still dictates into it.");
      } else if(err&&err.name==="NotFoundError"){
        say("No microphone found on this device.");
      } else {
        say("Mic unavailable ("+(err&&err.name?err.name:"unknown")+"). Holding a word will open a typing box instead.");
      }
    });
  }

  function buildRec(){
    var r=new SR();
    /* Mobile Chrome ignores continuous mode and ends after a pause, so ask for
       single utterances there and restart as long as the finger is still down. */
    r.continuous=!isMobile;
    r.interimResults=true;
    r.maxAlternatives=1;
    r.lang="en-US";

    r.onstart=function(){
      listening=true;
      recLabel.textContent="Recording";
    };

    r.onresult=function(ev){
      /* Rebuild from the whole result list rather than appending deltas —
         appending is what turns a re-reported phrase into a duplicate. */
      var fin="", inter="";
      for(var i=0;i<ev.results.length;i++){
        var chunk=ev.results[i][0].transcript;
        if(ev.results[i].isFinal) fin+=chunk+" "; else inter+=chunk+" ";
      }
      runFinal=fin;
      heard=dedupe((committed+" "+fin).trim());
      capTxt.textContent=dedupe((heard+" "+inter).trim());
    };

    r.onerror=function(ev){
      if(ev.error==="not-allowed"||ev.error==="service-not-allowed"){
        voiceMode=false; wantVoice=false;
        recLabel.textContent="Mic unavailable";
      } else if(ev.error==="network"){
        recLabel.textContent="No connection to the speech service";
      } else if(ev.error==="no-speech"){
        recLabel.textContent="Didn't catch that \u2014 keep talking";
      }
    };

    r.onend=function(){
      listening=false;
      committed=dedupe((committed+" "+runFinal).trim());
      runFinal="";
      heard=committed;

      if(wantVoice && restarts<60){
        restarts++;
        try{ r.start(); return; }catch(e){}
      }
      recLabel.textContent = wantVoice ? "Mic stopped \u2014 let go and type instead" : "Hold to talk";
      if(pending) finish();
    };
    return r;
  }

  function startListening(){
    heard=""; committed=""; runFinal=""; restarts=0;
    capTxt.textContent="";
    if(!voiceMode) return;
    wantVoice=true;
    try{
      if(!rec) rec=buildRec();
      rec.start();
    }catch(e){ /* already running */ }
  }

  function stopListening(){
    wantVoice=false;
    if(voiceMode && listening && rec){
      try{ rec.stop(); }
      catch(e){ listening=false; heard=dedupe((committed+" "+runFinal).trim()); finish(); }
    } else {
      heard=dedupe((committed+" "+runFinal).trim());
      finish();
    }
  }

  /* ---------------- text prep ---------------- */
  function load(text){
    nodes={}; seq=0; nextId=1;
    focusNode(makeNode(text,null,null));
  }

  function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  function render(){
    /* The number beside a word is the number the AI will answer, so it comes
       from the basket, not from this page's position in it. */
    var num=noteNumbers();
    var marksAt={}, annotated={}, done={}, kidsByPara={};
    pageNotes().forEach(function(n,i){
      (marksAt[n.e]=marksAt[n.e]||[]).push(num[n.id]||(i+1));
      for(var k=n.s;k<=n.e;k++) annotated[k]=true;
    });
    var n=node();
    var answered=(n?n.kids:[]).filter(function(k){ return nodes[k]&&!nodes[k].merge; })
      .sort(function(a,b){
        return (nodes[a].para-nodes[b].para) || (nodes[a].s-nodes[b].s);
      });
    var replyMark={};
    answered.forEach(function(kid,i){
      var k=nodes[kid];
      for(var j=k.s;j<=k.e;j++) done[j]=true;
      (replyMark[k.e]=replyMark[k.e]||[]).push(i+1);
    });

    var seen={};

    /* Everything under this page is shown the way the read-through view shows it:
       the note as a heading, the reply in full, deeper replies nested inside. */
    function branch(id,depth,label){
      if(seen[id]) return "";
      seen[id]=true;
      var m=nodes[id];
      if(!m) return "";
      var hid=collapsed[id]?" hid":"";
      var meta=[];
      if(m.parents.length>1) meta.push("answers a note across "+m.parents.length+" pages");
      if(m.status!=="open") meta.push(m.status);
      if(m.notes.length) meta.push(m.notes.length+" note"+(m.notes.length>1?"s":"")+" with no reply yet");
      if(m.kids.length) meta.push(m.kids.length+" repl"+(m.kids.length>1?"ies":"y"));

      var h='<div class="rnode'+
            (m.status==="resolved"?" resolved":"")+
            (m.status==="dropped"?" dropped":"")+'">'+
            '<button class="rfold" data-fold="'+m.id+'" title="'+
              (collapsed[id]?"Show":"Hide")+' this reply">'+
              (collapsed[id]?"\u25B8":"\u25BE")+"</button>"+
            '<button class="rhead" data-node="'+m.id+'">'+
              (label?'<span class="rnum">'+label+"</span> ":"")+esc(m.note||"Reply")+
              (meta.length?'<span class="rmeta">'+esc(meta.join(" \u00B7 "))+"</span>":"")+
            "</button>";
      if(m.quote) h+='<span class="rquote">\u201C'+esc(m.quote)+"\u201D</span>";
      h+='<div class="rtext'+hid+'">'+esc(m.text)+"</div>";
      m.notes.forEach(function(nt){
        h+='<span class="rnote'+hid+'">Still open: '+esc(nt.text)+"</span>";
      });

      if(!collapsed[id]){
        m.kids.forEach(function(k){
          if(nodes[k]&&nodes[k].parents.every(function(pp){ return seen[pp]; }))
            h+=branch(k,depth+1);
        });
      }
      return h+"</div>";
    }



    var html="";
    if(n&&n.parents.length){
      var up=nodes[firstParent(n)];
      html+='<div class="pagehead">'+
              '<div class="ctx">'+
                (n.quote?'<span class="cq">\u201C'+esc(n.quote)+'\u201D</span>':"")+
                '<span class="cn">'+esc(n.note)+"</span>"+
                '<span class="cs">'+
                  ["open","resolved","dropped"].map(function(k){
                    return '<button class="stat'+(n.status===k?" on":"")+'" data-status="'+k+'">'+
                           (k==="open"?"Open":k==="resolved"?"Resolved":"Dropped")+"</button>";
                  }).join("")+
                "</span>"+
              "</div>"+
            "</div>";
    }
    /* Exactly one word carries tabindex 0 so the reader is a single tab stop,
       and the arrow keys move within it from there. */
    if(kbA<0||kbA>=words.length) kbA=kbB=words.length?0:-1;
    var cp=-1;
    words.forEach(function(w,i){
      if(w.p!==cp){
        if(cp!==-1) html+="</p>";
        html+="<p>"; cp=w.p;
      }
      /* Carry the following space inside the span while the run continues, so
         a phrase gets one unbroken underline rather than one per word. A mark
         sits between the words, which ends the run. */
      var marked=marksAt[i]||replyMark[i];
      var cont=!marked && i+1<words.length && words[i+1].p===w.p &&
               ((annotated[i]&&annotated[i+1]) ||
                (done[i]&&done[i+1]&&!annotated[i]&&!annotated[i+1]));
      var cls="w"+(annotated[i]?" annot":"")+(done[i]&&!annotated[i]?" done":"")+
              (cont?" cont":"");
      html+='<span class="'+cls+'" data-i="'+i+'" tabindex="'+(i===kbA?"0":"-1")+'">'+
            esc(w.t)+(cont?" ":"")+"</span>";
      if(marksAt[i]) html+='<sup class="mk">'+marksAt[i].join(",")+"</sup>";
      if(replyMark[i]) html+='<sup class="mk ans">'+replyMark[i].join(",")+"</sup>";
      if(!cont) html+=" ";
    });
    if(cp!==-1) html+="</p>";

    if(answered.length){
      html+='<div class="mergehead">Replies</div>';
      html+=answered.map(function(k,i){ return branch(k,0,i+1); }).join("");
    }

    var merged=(n?n.kids:[]).filter(function(k){ return nodes[k]&&nodes[k].merge; });
    if(merged.length){
      html+='<div class="mergehead">Replies spanning this page and others</div>';
      html+=merged.map(function(k){ return branch(k,0); }).join("");
    }
    readerEl.innerHTML=html;
  }

  /* ---------------- hold / tap gesture ---------------- */
  var overlayAt=0;
  var promptDirty=false;
  var CTX=["path","page","all"], ctxMode="path";
  var timer=null, engaged=false, startPt=null, anchorA=-1, anchorB=-1, tapIdx=-1;
  var kbA=-1, kbB=-1;   // keyboard cursor / selection over the same words

  function wordAt(x,y){
    var el=document.elementFromPoint(x,y);
    if(el&&el.classList&&el.classList.contains("w")) return parseInt(el.dataset.i,10);
    return -1;
  }
  function paintRange(a,b){
    var lo=Math.min(a,b), hi=Math.max(a,b);
    var all=readerEl.querySelectorAll(".w");
    for(var i=0;i<all.length;i++){
      var idx=parseInt(all[i].dataset.i,10);
      all[i].classList.toggle("live", idx>=lo && idx<=hi);
    }
  }
  function paintLive(){ paintRange(anchorA,anchorB); }
  function clearLive(){
    var all=readerEl.querySelectorAll(".w.live");
    for(var i=0;i<all.length;i++) all[i].classList.remove("live");
  }

  readerEl.addEventListener("input",function(){
    if(readerEl.classList.contains("editing"))
      readerEl.dataset.empty=readSurface().trim()?"0":"1";
  });

  /* ---------------- keyboard annotation ----------------
     Holding and dragging is the whole interaction, which left the app unusable
     without a pointer. The same two moves — pick a word, widen to a phrase —
     are here on the arrow keys, with one tab stop into the text. */
  function wordEl(i){ return readerEl.querySelector('.w[data-i="'+i+'"]'); }

  function kbGo(i,extend){
    if(!words.length) return;
    i=Math.max(0,Math.min(i,words.length-1));
    kbB=i;
    if(!extend) kbA=i;
    var all=readerEl.querySelectorAll(".w");
    var lo=Math.min(kbA,kbB), hi=Math.max(kbA,kbB);
    for(var k=0;k<all.length;k++){
      var idx=parseInt(all[k].dataset.i,10);
      all[k].classList.toggle("live", extend && idx>=lo && idx<=hi);
      all[k].setAttribute("tabindex", idx===kbA?"0":"-1");
    }
    var el=wordEl(i);
    if(el){ el.setAttribute("tabindex","0"); el.focus({preventScroll:false}); }
  }

  readerEl.addEventListener("focusin",function(e){
    var t=e.target;
    if(!t.classList||!t.classList.contains("w")) return;
    var i=parseInt(t.dataset.i,10);
    if(!isNaN(i) && i!==kbA && i!==kbB){ kbA=kbB=i; }
  });

  readerEl.addEventListener("keydown",function(e){
    if(readerEl.classList.contains("editing")) return;
    var t=e.target;
    if(!t.classList||!t.classList.contains("w")) return;
    var i=parseInt(t.dataset.i,10);
    if(isNaN(i)) return;

    if(e.key==="ArrowRight"||e.key==="ArrowDown"){
      e.preventDefault(); kbGo(kbB+1,e.shiftKey); return;
    }
    if(e.key==="ArrowLeft"||e.key==="ArrowUp"){
      e.preventDefault(); kbGo(kbB-1,e.shiftKey); return;
    }
    if(e.key==="Home"){ e.preventDefault(); kbGo(0,e.shiftKey); return; }
    if(e.key==="End"){ e.preventDefault(); kbGo(words.length-1,e.shiftKey); return; }
    if(e.key==="Enter"||e.key===" "){
      e.preventDefault();
      var lo=Math.min(kbA,kbB), hi=Math.max(kbA,kbB);
      paintRange(lo,hi);
      askType({s:lo,e:hi});
      return;
    }
    if(e.key==="Escape"){ kbA=kbB=i; clearLive(); }
  });

  readerEl.addEventListener("click",function(e){
    var t=e.target;
    if(t.classList&&t.classList.contains("stat")){
      var n2=node();
      if(n2){ n2.status=t.dataset.status; render(); refresh(); }
      return;
    }
    var fold=t.closest?t.closest(".rfold"):null;
    if(fold&&fold.dataset.fold){
      collapsed[fold.dataset.fold]=!collapsed[fold.dataset.fold];
      render();
      return;
    }
    var head=t.closest?t.closest(".rhead"):null;
    if(head&&head.dataset.node){
      focusNode(head.dataset.node);
      return;
    }
  });

  readerEl.addEventListener("pointerdown",function(e){
    if(readerEl.classList.contains("editing")) return;
    var t=e.target;
    if(!t.classList||!t.classList.contains("w")) return;
    var idx=parseInt(t.dataset.i,10);
    startPt={x:e.clientX,y:e.clientY};
    tapIdx=idx;
    clearTimeout(timer);
    timer=setTimeout(function(){
      engaged=true; anchorA=anchorB=idx;
      document.body.classList.add("gesturing");
      try{ readerEl.setPointerCapture(e.pointerId); }catch(err){}
      paintLive();
      capEl.classList.add("on");
      positionCaption();
      if(navigator.vibrate) navigator.vibrate(8);
      startListening();
    },140);
  });

  readerEl.addEventListener("pointermove",function(e){
    if(!engaged){
      if(startPt){
        var d=Math.hypot(e.clientX-startPt.x, e.clientY-startPt.y);
        if(d>10){ clearTimeout(timer); startPt=null; }
      }
      return;
    }
    var idx=wordAt(e.clientX,e.clientY);
    if(idx>=0 && idx!==anchorB){ anchorB=idx; paintLive(); }
  });

  readerEl.addEventListener("touchmove",function(e){
    if(engaged) e.preventDefault();
  },{passive:false});

  function release(){
    clearTimeout(timer);
    document.body.classList.remove("gesturing");
    if(!engaged){
      if(startPt&&tapIdx>=0){ paintRange(tapIdx,tapIdx); askType({s:tapIdx,e:tapIdx}); }
      startPt=null; tapIdx=-1;
      return;
    }
    startPt=null; tapIdx=-1;
    engaged=false;
    var a=Math.min(anchorA,anchorB), b=Math.max(anchorA,anchorB);
    /* Stamp the page the words belong to. The microphone closes asynchronously
       \u2014 on a phone that is a network round trip \u2014 so by the time the transcript
       lands the reader may well be showing a different page. Without this the
       note is filed against whatever is open then, carrying this page's token
       indices, and lands somewhere it can never be read from. */
    pending={id:curId,s:a,e:b};
    capEl.classList.remove("on");
    stopListening();
  }
  readerEl.addEventListener("pointerup",release);
  readerEl.addEventListener("pointercancel",release);
  window.addEventListener("blur",function(){ if(engaged) release(); });

  function finish(){
    var p=pending; pending=null;
    if(!p) return;
    var said=heard.trim();
    if(!said){
      /* Nothing was heard. Only offer the typing box if the reader is still on
         the page the gesture started on; otherwise the anchor is meaningless. */
      if(p.id===curId) askType(p);
      else toast("Didn't catch that");
      return;
    }
    addNote(p.s,p.e,said,p.id);
  }

  function addNote(s,e,text,pageId){
    var id=pageId==null?curId:pageId;
    var target=nodes[id];
    if(!target) return;
    var list=target.notes;
    list.push({id:nextId++,s:s,e:e,text:text});
    list.sort(function(x,y){ return x.s-y.s || x.e-y.e; });
    if(id!==curId){
      /* Filed on the page it was spoken on, which is no longer the page in
         front of the reader \u2014 say so rather than letting it vanish. */
      toast("Note saved on the previous page");
      saveSoon();
      return;
    }
    render(); refresh();
  }

  /* Anchors can outlive the text they point at: an imported thread may carry
     indices from a different revision, and a note can be filed against a page
     other than the one on screen. Clamp rather than throw \u2014 one stale anchor
     must never take down the whole note list. */
  function span(a,b,toks){
    var T=toks||TOK;
    if(!T.length) return "";
    var lo=Math.max(0,Math.min(a|0,T.length-1));
    var hi=Math.max(lo,Math.min(b|0,T.length-1));
    var out=[]; for(var i=lo;i<=hi;i++){ if(T[i]) out.push(T[i].t); }
    return out.join(" ");
  }
  function quoteFor(n,toks){
    var T=toks||TOK;
    if(!T.length) return "";
    var s=Math.max(0,Math.min(n.s|0,T.length-1));
    var e=Math.max(s,Math.min(n.e|0,T.length-1));
    var core=span(s,e,T);
    if(e-s>=2) return core;
    var back=s;
    while(back>0 && s-back<6) back--;
    var lead=back<s?span(back,s-1,T):"";
    return (back>0?"\u2026":"")+(lead?lead+" ":"")+core;
  }

  /* Send what was actually pasted. Rebuilding prose from the token array
     re-joined every run of whitespace to a single space, so indentation, line
     breaks inside a paragraph, lists and code blocks all reached the model
     flattened. Tokens are for anchoring; they are not the text. */
  function sourceText(){
    var n=node();
    return n?n.text.replace(/\r/g,"").trim():"";
  }

  /* Models drift off the requested format constantly, so accept the separators
     they actually reach for \u2014 "1." and "1)" as well as arrows and dashes.
     Reports whether the [[notes]] fence was present: without it we are reading
     the whole message and any incidental numbered list looks like an answer,
     so the caller confirms before acting. */
  function parseReply(raw){
    var m=raw.match(/\[\[notes\]\]([\s\S]*?)(?:\[\[\/notes\]\]|$)/i);
    var fenced=!!m;
    var body=fenced?m[1]:raw;
    var map={}, cur=null;
    body.split(/\n/).forEach(function(L){
      var hit=L.match(/^\s*\[?(\d{1,3})\]?\s*(?:\u2192|->|=>|:|\u2014|[-.)])\s*(.+)$/);
      if(hit){ cur=hit[1]; map[cur]=(map[cur]?map[cur]+"\n":"")+hit[2].trim(); }
      /* Only glue trailing lines onto the previous answer inside a fence. In an
         unfenced message those lines are ordinary prose, not continuations. */
      else if(fenced && cur && L.trim()) map[cur]+="\n"+L.trim();
    });
    return {answers:map, fenced:fenced};
  }

  /* Answers come back numbered against the basket, and the basket spans pages,
     so each answer has to be routed to the page its own note sits on. One
     pasted reply can therefore grow branches in several places at once. */
  function attachReplies(raw){
    var parsed=parseReply(raw), map=parsed.answers;
    var list=noteEntries();
    var found=list.filter(function(e,i){ return map[String(i+1)]; }).length;
    if(!found){ toast("No numbered answers found"); return; }
    if(!parsed.fenced &&
       !confirm("I couldn't find the [[notes]] block in that reply.\n\n"+
                "Attach "+found+" numbered item"+(found>1?"s":"")+" as replies anyway?")) return;

    var hit=0, kept=0, touched={}, drop={};
    list.forEach(function(e,i){
      var ans=map[String(i+1)];
      if(!ans){ kept++; return; }
      var pid=e.pid, n=e.note, toks=toksFor(pid);
      var at=Math.max(0,Math.min(n.e|0,Math.max(0,toks.length-1)));
      makeNode(ans.trim(),pid,{
        quote:quoteFor(n,toks), note:n.text, s:n.s, e:n.e,
        para:toks[at]?toks[at].p:0
      });
      hit++;
      touched[pid]=1;
      (drop[pid]=drop[pid]||{})[n.id]=1;
    });

    Object.keys(drop).forEach(function(pid){
      if(!nodes[pid]) return;
      nodes[pid].notes=nodes[pid].notes.filter(function(n){ return !drop[pid][n.id]; });
    });

    render(); refresh(); syncNav();
    var pages=Object.keys(touched).length;
    toast(hit+" attached"+(pages>1?" across "+pages+" pages":"")+
          (kept?", "+kept+" unanswered":""));
  }

  function editNote(n,el){
    if(el.classList.contains("editing")) return;
    el.setAttribute("contenteditable","true");
    el.classList.add("editing");
    el.focus();
    var r=document.createRange(); r.selectNodeContents(el); r.collapse(false);
    var sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    var closed=false;
    function done(){
      if(closed) return; closed=true;
      el.removeAttribute("contenteditable"); el.classList.remove("editing");
      var v=(el.innerText||el.textContent||"").trim();
      if(v) n.text=v;
      refresh();
    }
    el.addEventListener("blur",done);
    el.addEventListener("keydown",function(e){
      if(e.key==="Escape"){ el.textContent=n.text; closed=true; el.removeAttribute("contenteditable"); el.classList.remove("editing"); refresh(); }
      if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); el.blur(); }
    });
  }

  /* ---------------- modes + prompt ---------------- */
  var MODES=[
    {k:"rewrite",label:"Rewrite",hint:"Returns the revised text, ready to paste.",
     head:"Below is a piece of text, then my notes on it. Each note is anchored to the exact words that prompted it.",
     tail:"Apply my notes and return the full revised text. Return only the text — no preamble, no summary of what you changed, no commentary. If a note is a question rather than an instruction, answer it in a short list underneath the text."},
    {k:"respond",label:"Respond",hint:"Answers your notes in prose. No rewriting.",
     head:"Below are my notes on the text, each anchored to the exact words that prompted it, in reading order.",
     tail:"Respond to each note in order. Some are questions, some are objections, some just mean expand here — infer which from how it's phrased. Don't rewrite the text; just talk to me about the marked parts."},
    {k:"push",label:"Push back",hint:"Argues where you're wrong instead of agreeing.",
     head:"Below are my notes on the text, each anchored to the exact words that prompted it.",
     tail:"Where you think a note of mine is mistaken, say so and make the case. Where I'm right, concede it plainly and briefly. I'd rather be argued with than accommodated, so don't soften a disagreement to keep things pleasant."},
    {k:"options",label:"Options",hint:"Gives you a few alternatives per note, not one answer.",
     head:"Below are my notes on the text, each anchored to the exact words that prompted it.",
     tail:"For each note, give two or three genuinely different alternatives rather than one answer, and say in a few words what each one trades off. Don't pick a favourite unless I asked."},
    {k:"check",label:"Check",hint:"Verifies the marked claims.",
     head:"Below are the parts of the text I want checked, each anchored to the exact words in question.",
     tail:"For each marked passage, tell me whether the claim holds up, how sure you are, and what it rests on. Say plainly when you can't verify something rather than guessing."}
  ];
  var mode=MODES[1];

  var BLOCK="\n\nWhen you're done, end your message with a block in exactly this format, so my app can put your answers back beside the notes that prompted them:\n\n[[notes]]\n1 \u2192 your response to note 1\n2 \u2192 your response to note 2\n[[/notes]]\n\nWrite however you like above the block. Use the note numbers exactly as given, keep each answer on one line, and don't repeat my text back inside the block.";

  function pathTo(id){
    var out=[], x=nodes[id];
    while(x){ out.unshift(x.id); x=x.parents.length?nodes[x.parents[0]]:null; }
    return out;
  }

  function statusLine(n){
    return n.status==="resolved"?"Resolved" : n.status==="dropped"?"Dropped" : "Open";
  }

  /* One line per thread in the whole graph — continuity without the bulk.
     `omit` holds note ids that are being asked in full further down, so the
     ledger never repeats a question it is about to be handed properly. */
  function ledger(skipId,omit){
    var lines=[];
    omit=omit||{};
    Object.keys(nodes).forEach(function(id){
      var x=nodes[id];
      if(!x.parents.length || id===skipId) return;
      lines.push(statusLine(x)+": "+trim(x.note,90));
    });
    Object.keys(nodes).forEach(function(id){
      if(id===skipId) return;   // listed in full further down; no need to repeat
      nodes[id].notes.forEach(function(nt){
        if(omit[nt.id]) return;
        lines.push("Open (no reply yet): "+trim(nt.text,90));
      });
    });
    return lines;
  }

  function provenance(n){
    if(!n||!n.parents.length) return "";
    var out="This page was written in reply to a note I left"+
            (n.quote?" on: \u201C"+n.quote+"\u201D":"")+"\n";
    out+="My note was: "+n.note+"\n\n";
    return out;
  }

  function contextBlock(){
    var n=node();
    if(!n) return "";
    var out="";

    if(ctxMode!=="page" && n.parents.length){
      var path=pathTo(n.id);
      out+="--- HOW WE GOT HERE ---\n";
      path.slice(0,-1).forEach(function(id,i){
        var x=nodes[id];
        out+="["+(i+1)+"] "+(x.parents.length?"In reply to my note \u201C"+trim(x.note,80)+"\u201D:":"The original text:")+
             "\n"+x.text+"\n\n";
      });
      out+="--- END ---\n\n";
    }

    if(ctxMode==="all"){
      var others=Object.keys(nodes).filter(function(id){
        return pathTo(n.id).indexOf(id)<0;
      });
      if(others.length){
        out+="--- OTHER BRANCHES ---\n";
        others.forEach(function(id){
          var x=nodes[id];
          out+=(x.note?"In reply to \u201C"+trim(x.note,80)+"\u201D:":"")+"\n"+trim(x.text,700)+"\n\n";
        });
        out+="--- END ---\n\n";
      }
    }

    var asked={};
    noteEntries().forEach(function(e){ asked[e.note.id]=1; });
    var led=ledger(n.id,asked);
    if(led.length){
      out+="--- THREADS SO FAR ---\n"+led.join("\n")+
           "\nDon't reopen anything already marked resolved or dropped unless I ask.\n--- END ---\n\n";
    }
    return out+provenance(n);
  }

  /* How a page came to exist, in one line, so a note deep in a branch arrives
     with its lineage without printing every ancestor in full. */
  function pageHeading(id,numOfPage){
    var x=nodes[id];
    if(!x||!x.parents.length) return "the original text";
    var up=firstParent(x), at=numOfPage[up];
    return "written in reply to my note \u201C"+trim(x.note,90)+"\u201D"+
           (at?" on page "+at:"")+
           (x.parents.length>1?", which answered a note across "+x.parents.length+" pages":"");
  }

  function buildPrompt(){
    var list=noteEntries();
    if(!list.length) return "";

    /* One page's worth of notes reads better as a single text with notes on it,
       which is what this always was. */
    var used=[], seen={};
    list.forEach(function(e){ if(e.pid&&!seen[e.pid]){ seen[e.pid]=1; used.push(e.pid); } });
    if(used.length<=1){
      var out=mode.head+"\n\n"+contextBlock();
      out+="--- TEXT ---\n"+sourceText()+"\n--- END TEXT ---\n\n--- MY NOTES ---\n";
      list.forEach(function(e,i){
        out+="["+(i+1)+"] \u201C"+quoteFor(e.note,toksFor(e.pid))+"\u201D\n    \u2192 "+e.note.text+"\n\n";
      });
      out+="--- END NOTES ---\n\n"+mode.tail+BLOCK;
      return out;
    }

    /* Notes spread across the thread. Every page carrying one goes in whole, in
       reading order, and the notes are numbered straight through them so a
       single reply can answer all of them at once. */
    var numOfPage={};
    used.forEach(function(pid,i){ numOfPage[pid]=i+1; });

    var out=mode.head+"\n\nMy notes are spread across several pages of a branching "+
            "conversation. Each page is below, then every note in reading order, "+
            "each one marked with the page it sits on and the words it is about.\n\n";

    used.forEach(function(pid,i){
      out+="--- PAGE "+(i+1)+" ("+pageHeading(pid,numOfPage)+") ---\n"+
           nodes[pid].text.replace(/\r/g,"").trim()+"\n--- END PAGE "+(i+1)+" ---\n\n";
    });

    var asked={};
    list.forEach(function(e){ asked[e.note.id]=1; });
    var led=ledger(null,asked);
    if(led.length){
      out+="--- THREADS SO FAR ---\n"+led.join("\n")+
           "\nDon't reopen anything already marked resolved or dropped unless I ask.\n--- END ---\n\n";
    }

    out+="--- MY NOTES ---\n";
    list.forEach(function(e,i){
      out+="["+(i+1)+"] on page "+numOfPage[e.pid]+", \u201C"+quoteFor(e.note,toksFor(e.pid))+"\u201D\n"+
           "    \u2192 "+e.note.text+"\n\n";
    });
    out+="--- END NOTES ---\n\n"+mode.tail+
         " Answer every note, wherever it sits \u2014 a note on one page may well "+
         "bear on another, so say so when it does."+BLOCK;
    return out;
  }

  function setMode(m){
    mode=m; syncMode(); prevEl.value=buildPrompt(); promptDirty=false;
    showMenu(false);
  }
  function drawMenu(){
    var box=$("modemenu"); box.innerHTML="";
    MODES.forEach(function(m){
      var b=document.createElement("button");
      b.className="mitem"+(m.k===mode.k?" on":"");
      b.innerHTML='<span class="n">'+m.label+'</span><span class="d">'+m.hint+"</span>";
      b.addEventListener("click",function(e){ e.stopPropagation(); setMode(m); });
      box.appendChild(b);
    });
  }
  function syncMode(){
    $("modebtn").innerHTML=mode.label+" \u25BE";
    drawMenu(); refreshCount();
  }
  function refreshCount(){ countEl.textContent=noteEntries().length; }

  /* ---------------- typing a note ---------------- */
  var typeTarget=null;
  function askType(p){
    typeTarget={id:p.id==null?curId:p.id, s:p.s, e:p.e};
    typeQ.textContent="\u201C"+span(p.s,p.e)+"\u201D";
    typeTxt.value="";
    openOverlay(typeEl,typeTxt);
  }
  /* Both targets have to be cleared together. Leaving treeTarget set after a
     discarded cross-page note meant the next ordinary note was filed against
     the map selection instead of the page — invisible until you reopened the
     map, and it healed itself after one note, so it read as random. */
  function closeType(){
    typeTarget=null; treeTarget=null;
    clearLive();
    closeOverlay(typeEl);
  }
  $("typesave").addEventListener("click",function(){
    var v=typeTxt.value.trim();
    var tt=typeTarget, tr=treeTarget;
    typeTarget=null; treeTarget=null;
    closeOverlay(typeEl);
    if(v&&tr){ treeTarget=tr; addTreeNote(v); treeTarget=null; }
    else if(v&&tt){ addNote(tt.s,tt.e,v,tt.id); }
    else clearLive();
  });
  typeTxt.addEventListener("keydown",function(e){
    if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); $("typesave").click(); }
    if(e.key==="Escape"){ closeType(); }
  });
  typeEl.addEventListener("click",function(e){
    if(Date.now()-overlayAt<450) return;
    if(e.target===typeEl) $("typesave").click();
  });
  $("typecancel").addEventListener("click",closeType);

  function refresh(){
    refreshCount();
    var list=noteEntries(), tree=inTree();
    /* Which page each note is on only matters once more than one is involved. */
    var pages={}, spread=0;
    list.forEach(function(e){ if(e.pid&&!pages[e.pid]){ pages[e.pid]=1; spread++; } });

    sheetEl.classList.toggle("empty",list.length===0);
    listEl.innerHTML="";
    list.forEach(function(e,i){
      var n=e.note;
      var d=document.createElement("div"); d.className="note";
      var num=document.createElement("div"); num.className="num"; num.textContent="["+(i+1)+"]";
      var body=document.createElement("div"); body.className="body";

      if(!tree && spread>1){

        ? n.ids.length+" page"+(n.ids.length>1?"s":"")+": "+n.ids.map(function(id){

        : "\u201C"+quoteFor(n,toksFor(e.pid))+"\u201D";

      var kill=document.createElement("button"); kill.className="kill"; kill.textContent="\u00D7";

      kill.addEventListener("click",function(){
        if(tree){ treeNotes=treeNotes.filter(function(x){ return x.id!==n.id; }); drawTree(); return; }
        /* Splice in place, on the note's own page. Reassigning a filtered copy
           used to leave the page still holding the original array, so the note
           came back the next time the page was opened. */

  var lastFocus=null;

    var open=openOverlays();

    if(e.key==="Escape"){
      e.preventDefault();
      if(el.id==="typein") closeType(); else closeOverlay(el);
      return;
    }
    if(e.key!=="Tab") return;
    var f=el.querySelectorAll("button, textarea, input:not([type=hidden]), [href], [tabindex]:not([tabindex='-1'])");
    var can=[];
    for(var i=0;i<f.length;i++) if(f[i].offsetParent!==null||f[i]===document.activeElement) can.push(f[i]);
    if(!can.length) return;
    var first=can[0], last=can[can.length-1];
    if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
  });

  /* ---------------- sample tree, for testing navigation ---------------- */
  /* ---------------- thread import / export ---------------- */
  var FORMAT=1;

  function serialize(){
    return {
      meristem:FORMAT, root:rootId(), cur:curId, seq:seq, nextId:nextId,
      nodes:Object.keys(nodes).map(function(id){
        var n=nodes[id];
        return {id:n.id,parents:n.parents,text:n.text,notes:n.notes,kids:n.kids,
                quote:n.quote,note:n.note,s:n.s,e:n.e,para:n.para,
                merge:!!n.merge,status:n.status||"open"};
      })
    };
  }
  function exportTree(){ return JSON.stringify(serialize(),null,1); }

  /* Turn arbitrary parsed JSON into a consistent node map, or null. Anchors are
     clamped to the page they sit on: a hand-edited or older thread can carry
     indices past the end of its own text, and an out-of-range anchor used to
     throw straight through the note list and blank the sheet. */
  function hydrate(data){
    if(!data||!Array.isArray(data.nodes)||!data.nodes.length) return null;

    var fresh={};
    data.nodes.forEach(function(n){
      if(!n||!n.id||typeof n.text!=="string") return;
      fresh[n.id]={
        id:n.id, parents:Array.isArray(n.parents)?n.parents:[], text:n.text,
        notes:Array.isArray(n.notes)?n.notes:[], kids:[],
        quote:n.quote||"", note:n.note||"", s:n.s|0, e:n.e|0, para:n.para|0,
        merge:!!n.merge, status:n.status||"open"
      };
    });
    var ids=Object.keys(fresh);
    if(!ids.length) return null;

    /* rebuild kid links from parents so the two can't disagree */
    var dropped=0;
    ids.forEach(function(id){
      var before=fresh[id].parents.length;
      fresh[id].parents=fresh[id].parents.filter(function(pid){ return fresh[pid]; });
      dropped+=before-fresh[id].parents.length;
      fresh[id].parents.forEach(function(pid){ fresh[pid].kids.push(id); });
      fresh[id].merge=fresh[id].parents.length>1;
    });

    ids.forEach(function(id){
      var last=Math.max(0,tokensOf(fresh[id].text).length-1);
      fresh[id].notes=fresh[id].notes.filter(function(nt){
        return nt && typeof nt.text==="string";
      }).map(function(nt){
        var s=Math.max(0,Math.min(nt.s|0,last));
        var e=Math.max(s,Math.min(nt.e|0,last));
        return {id:nt.id|0, s:s, e:e, text:nt.text};
      });
    });

    var roots=ids.filter(function(id){ return !fresh[id].parents.length; });
    if(!roots.length) return null;

    var next=Math.max(data.nextId|0,1);
    ids.forEach(function(id){
      fresh[id].notes.forEach(function(nt){ next=Math.max(next,(nt.id|0)+1); });
    });

    return {
      map:fresh, ids:ids, roots:roots, dropped:dropped,
      seq:Math.max(data.seq|0, ids.length), nextId:next,
      cur:fresh[data.cur]?data.cur:roots[0]
    };
  }

  function adopt(h){
    nodes=h.map; seq=h.seq; nextId=h.nextId;
    treeNotes=[]; picked=[]; collapsed={}; expanded={};
    focusNode(h.cur);
  }

  function importTree(raw){
    var data;
    try{ data=JSON.parse(raw); }
    catch(e){ toast("That isn't valid thread data"); return false; }
    if(!data||!Array.isArray(data.nodes)||!data.nodes.length){ toast("No pages in that data"); return false; }

    var h=hydrate(data);
    if(!h){ toast("No usable pages in that data"); return false; }
    adopt(h);
    toast(h.ids.length+" page"+(h.ids.length>1?"s":"")+" loaded"+
          (h.dropped?" ("+h.dropped+" broken link"+(h.dropped>1?"s":"")+" dropped)":""));
    return true;
  }

  /* ---------------- autosave ----------------
     The whole point of this app is a thread that accumulates over several
     rounds, so losing it to a refresh was the worst thing it did. Written on a
     short debounce after any change; restored on load. */
  var SAVE_KEY="meristem.thread.v1";
  var saveTimer=null, saveBroken=false;

  function storage(){
    try{ return window.localStorage; }catch(e){ return null; }
  }
  function save(){
    var store=storage();
    if(!store||saveBroken||!curId||!Object.keys(nodes).length) return;
    try{ store.setItem(SAVE_KEY,JSON.stringify(serialize())); }
    catch(e){
      /* Quota, or private mode on some browsers. Say it once and stop trying. */
      saveBroken=true;
      toast("Couldn't autosave — export to keep this thread");
    }
  }
  function saveSoon(){
    if(saveTimer) clearTimeout(saveTimer);
    saveTimer=setTimeout(function(){ saveTimer=null; save(); },400);
  }
  function clearSaved(){
    var store=storage();
    if(!store) return;
    try{ store.removeItem(SAVE_KEY); }catch(e){}
  }

  /* The scope is a working preference, not part of the thread, so it outlives
     "New text" and travels with the browser rather than the export. */
  var SCOPE_KEY="meristem.scope.v1";
  function saveScope(){
    var store=storage();
    if(!store) return;
    try{ store.setItem(SCOPE_KEY,noteScope); }catch(e){}
  }
  function loadScope(){
    var store=storage();
    if(!store) return;
    try{
      var v=store.getItem(SCOPE_KEY);
      if(v==="page"||v==="thread") noteScope=v;
    }catch(e){}
  }
  function restore(){
    var store=storage();
    if(!store) return false;
    var raw;
    try{ raw=store.getItem(SAVE_KEY); }catch(e){ return false; }
    if(!raw) return false;
    var h;
    try{ h=hydrate(JSON.parse(raw)); }catch(e){ h=null; }
    if(!h){ clearSaved(); return false; }
    adopt(h);
    return true;
  }

  var dragDepth=0;
  function isFileDrag(e){
    var dt=e.dataTransfer;

    return false;

     back to the clipboard where downloads aren't available. */
  function exportName(){

    return "meristem-"+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+

  function tokensOf(text){
    var out=[];
    text.replace(/\r/g,"").split(/\n\s*\n/).filter(function(t){return t.trim().length;})
      .forEach(function(para,pi){
        para.trim().split(/\s+/).forEach(function(w){ out.push({t:w,p:pi}); });
      });
    return out;
  }
  function anchorIn(text,hint){
    var toks=tokensOf(text), h=hint.toLowerCase();
    for(var i=0;i<toks.length;i++){
      if(toks[i].t.toLowerCase().replace(/[^a-z0-9]/g,"").indexOf(h)===0){
        var e=Math.min(i+2,toks.length-1);
        return {s:i,e:e,para:toks[i].p,
                quote:toks.slice(i,e+1).map(function(t){return t.t;}).join(" ")};
      }
    }
    return {s:0,e:0,para:0,quote:toks.length?toks[0].t:""};
  }
  function kidOf(parentId,hint,note,text){
    var a=anchorIn(nodes[parentId].text,hint);
    return makeNode(text,parentId,{quote:a.quote,note:note,s:a.s,e:a.e,para:a.para});
  }

  $("sampletree").addEventListener("click",function(){
    nodes={}; seq=0; nextId=1;
    var root=makeNode(SAMPLE,null,null);

    var a=kidOf(root,"interface","Is this actually true though, or just a nice line?",
      "It's closer to true than it sounds, but the phrasing overstates it. Model quality still gates plenty of tasks. What changed is that for reading-heavy work the interface is now the binding constraint, which is a narrower claim than the sentence makes.\n\nThe honest version: for a large class of everyday use, you would notice a better interface more than a better model.");
    var b=kidOf(root,"memory","Why is longer memory the wrong lever exactly?",
      "Memory solves recall across turns. The problem described here is within a single response — you are reading one long answer and accumulating objections as you go. No amount of memory helps, because nothing has been forgotten yet.\n\nThey are orthogonal fixes to different failures, and memory is the one that demos well.");
    var c=kidOf(root,"reading","Say more about the asymmetry between reading and writing.",
      "Every control in a chat product acts on the message you are composing. Nothing acts on the message you are reading. You can scroll it, and select it, and that is the whole vocabulary.\n\nCompare a code review tool, where the read surface is where all the interaction lives.");

    kidOf(a,"overstates","Which tasks are still gated by model quality?",

  function readSurface(){

    Array.prototype.forEach.call(readerEl.children,function(el){

  }

  function toEditor(){
    var keep=$("scroller").scrollTop;
    // Do NOT rebuild the DOM. render() has already drawn the paragraphs;
    // editing just makes those same nodes writable, so nothing can shift.
    if(!words.length){
      readerEl.innerHTML='<p data-ph="'+readerEl.dataset.ph+'"><br></p>';
      readerEl.dataset.empty="1";
    }
    readerEl.setAttribute("contenteditable","true");
    readerEl.classList.add("editing");

    $("edit").hidden=true; $("reset").hidden=true; $("go").hidden=false;

    $("scroller").scrollTop=keep;
